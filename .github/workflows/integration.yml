name: Integration

# LocalStack was dropped here: localstack/localstack:latest now exits with
# "License activation failed" unless LOCALSTACK_AUTH_TOKEN is set, which broke
# every run from ~2026-05 onward. The old job also mostly asserted that
# LocalStack worked (create a bucket, list it back) rather than testing this
# repo, so the checks that remain are the ones that exercise our own code.
#
# AWS-facing code paths (Bedrock Converse, SageMaker, credential lookup) are
# still verified by hand against a real account — they are not covered here.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "src/**"
      - "test/**"
      - "project.clj"
      - ".github/workflows/integration.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  clojure:
    name: Clojure exercises (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          lein: 2.11.2

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-lein-${{ hashFiles('project.clj') }}
          restore-keys: ${{ runner.os }}-lein-

      - name: Fetch Clojure deps
        run: lein deps

      # Covers: every exercise namespace compiles, the agent-loop tool
      # handlers, and the guardrail engine.
      - name: Run tests
        run: lein test

      - name: Static analysis
        run: lein eastwood

      - name: Run the exam-prep overview
        run: lein run

  python:
    name: Python scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Syntax-only: the scripts import boto3 and call AWS at runtime, so
      # importing them here would need credentials we deliberately do not have.
      # aws-bedrock-rag/ is excluded for the same reason Lint excludes it —
      # setup.py is a notebook export whose "!pip install" lines are not Python.
      - name: Byte-compile scripts
        run: python -m compileall -q scripts
